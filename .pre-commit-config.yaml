# Install once with: uvx pre-commit install
# Uses the project's own ruff version (from uv.lock) so local hooks and CI agree.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
