name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: OpenAPI document is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code apps/web/openapi.json \
            || (echo "::error::Run 'uv run python scripts/export_openapi.py' and commit the result" && exit 1)

  web:
    name: Angular lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: API types are up to date
        run: |
          npm run api:generate
          git diff --exit-code src/app/api/schema.d.ts \
            || (echo "::error::Run 'npm run api:generate' in apps/web and commit the result" && exit 1)
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build

  terraform:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
      - run: terraform fmt -check -diff
      # No backend and no credentials: this checks the configuration, not the cloud.
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  stack:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Start the stack
        run: docker compose up --build --detach
      - name: Wait for telemetry to flow end to end
        run: |
          uv sync --locked
          uv run python scripts/smoke_test.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
