# Used for creating new migrations during development:
#   uv run alembic -c apps/backend/alembic.ini revision --autogenerate -m "describe change"
# The database URL comes from FLEETPULSE_DATABASE_URL (see fleetpulse_backend.config).
[alembic]
script_location = fleetpulse_backend:migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
