[project]
name = "fleetpulse-backend"
version = "0.1.0"
description = "FleetPulse API (FastAPI) and ingestion worker."
requires-python = ">=3.13"
dependencies = [
    "aiomqtt>=2.3",
    "alembic>=1.20",
    "anyio>=4.6",
    "asyncpg>=0.32",
    "fastapi>=0.115",
    "fleetpulse-contracts",
    "influxdb3-python>=0.12",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.1",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
fleetpulse-worker = "fleetpulse_backend.worker.main:run"
fleetpulse-migrate = "fleetpulse_backend.db.migrate:run"
fleetpulse-seed = "fleetpulse_backend.db.seed:run"

[tool.uv.sources]
fleetpulse-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
