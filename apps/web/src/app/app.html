<a class="skip-link" href="#main">Skip to content</a>

<mat-toolbar class="toolbar">
  <span class="brand">
    <mat-icon>directions_boat</mat-icon>
    FleetPulse
  </span>
  @if (user()) {
    <nav class="nav" aria-label="Main">
      <a
        routerLink="/"
        routerLinkActive="nav-link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        class="nav-link"
        >Overview</a
      >
      <a
        routerLink="/alerts"
        routerLinkActive="nav-link--active"
        ariaCurrentWhenActive="page"
        class="nav-link"
      >
        Alerts
        @if (openAlerts() > 0) {
          <span class="badge">{{ openAlerts() }}<span class="visually-hidden"> open</span></span>
        }
      </a>
    </nav>
  }
  <span class="spacer"></span>
  <span class="simulated" title="All vessels and readings on this site are simulated">
    Simulated data
  </span>
  @if (user(); as user) {
    <span class="socket" [class]="'socket--' + socketState()" role="status" aria-live="polite">
      <span class="socket-dot" aria-hidden="true"></span>
      <span class="socket-label">{{ socketLabel() }}</span>
    </span>
    <span class="user">
      <span class="user-name">{{ user.display_name }}</span>
      <span class="visually-hidden">, </span>
      <span class="user-role">{{ user.role }}</span>
    </span>
    <button mat-button type="button" (click)="signOut()">Sign out</button>
  }
</mat-toolbar>

<main id="main" class="content" tabindex="-1">
  <router-outlet />
</main>
