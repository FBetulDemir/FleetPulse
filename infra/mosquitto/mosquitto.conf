# Local development broker.
# Anonymous access is acceptable only because the port is bound to localhost in
# compose.yaml. Production uses per-service passwords and topic ACLs.
listener 1883
allow_anonymous true

# Persist retained messages (vessel online/offline state) across broker restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
