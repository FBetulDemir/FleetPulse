# Production broker. Not reachable from the internet (no published port): only the
# services in the Docker network connect, each with its own login and topic rights.
listener 1883
allow_anonymous false

# Generated from environment variables when the container starts (see compose.prod.yaml).
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
