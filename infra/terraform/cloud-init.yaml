#cloud-config
# First boot of the FleetPulse VM: Docker, a firewall that allows web traffic, and the
# code. Secrets are not part of this file; the .env is created by hand on the server.

package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - iptables-persistent

runcmd:
  # Docker from Docker's own repository (the Ubuntu package lags behind).
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - echo "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu

  # Oracle's Ubuntu images ship iptables rules that reject everything except SSH, in
  # addition to the cloud security list. Open web traffic here too.
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p udp --dport 443 -j ACCEPT
  - netfilter-persistent save

  - git clone https://github.com/FBetulDemir/FleetPulse.git /opt/fleetpulse
  - chown -R ubuntu:ubuntu /opt/fleetpulse
